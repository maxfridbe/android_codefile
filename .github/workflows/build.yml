name: CodeFile Android
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: docker
          tags: androidbase-builder:latest
          load: true
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Restore private signing key if configured
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_B64 }}
          KEYSTORE_PROPERTIES: ${{ secrets.ANDROID_KEYSTORE_PROPERTIES }}
        run: |
          if [ -n "$KEYSTORE_B64" ]; then
            mkdir -p keystore
            printf '%s' "$KEYSTORE_B64" | base64 -d > keystore/release.keystore
            printf '%s\n' "$KEYSTORE_PROPERTIES" > keystore/keystore.properties
          fi
      - run: CONTAINER_ENGINE=docker SKIP_IMAGE_BUILD=1 BUILD_TASK='assembleDebug assembleRelease lint testDebugUnitTest' ./build.sh codefile
      - uses: actions/upload-artifact@v4
        with:
          name: CodeFile-APKs
          path: output/codefile/*.apk
          if-no-files-found: error
