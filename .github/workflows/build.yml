name: CodeFile Android
on:
  push:
    branches: ['**']
    tags: ['v*']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: docker
          tags: codefile-builder:latest
          load: true
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Restore private signing key if configured
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_B64 }}
          KEYSTORE_PROPERTIES: ${{ secrets.ANDROID_KEYSTORE_PROPERTIES }}
        run: |
          if [ -n "$KEYSTORE_B64" ]; then
            mkdir -p keystore
            printf '%s' "$KEYSTORE_B64" | base64 -d > keystore/release.keystore
            printf '%s\n' "$KEYSTORE_PROPERTIES" > keystore/keystore.properties
          fi
      - run: CONTAINER_ENGINE=docker SKIP_IMAGE_BUILD=1 BUILD_TASK='assembleDebug assembleRelease bundleRelease lint testDebugUnitTest checkNativeStyle' ./build.sh codefile
      - run: python3 scripts/audit-native-apk.py output/codefile/codefile-$(cat VERSION)-release.apk
      - run: ./scripts/test-java.sh
      - uses: actions/upload-artifact@v4
        with:
          name: CodeFile-APKs
          path: output/codefile/*
          if-no-files-found: error
  release:
    # Only a version tag publishes; ordinary pushes and pull requests stop after the build.
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: CodeFile-APKs
          path: dist
      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
          PROJECT_KEY: ${{ secrets.ANDROID_KEYSTORE_B64 != '' }}
        run: |
          set -euo pipefail
          [ "$TAG" = "$(cat VERSION)" ] || { echo "Tag $TAG does not match VERSION $(cat VERSION)"; exit 1; }
          cd dist
          files=(codefile-"$TAG"-release.apk codefile-"$TAG"-release.aab)
          sha256sum "${files[@]}" > "codefile-$TAG-sha256.txt"
          {
            echo "CodeFile $TAG"
            echo
            echo "- \`codefile-$TAG-release.apk\`: install directly on a device (Android 7.0+)."
            echo "- \`codefile-$TAG-release.aab\`: Android App Bundle for a store upload."
            echo "- \`codefile-$TAG-sha256.txt\`: SHA-256 checksums."
            if [ "$PROJECT_KEY" != "true" ]; then
              echo
              echo "> Signed with a throwaway key generated by this CI run, because no signing key is configured as a repository secret. A later release will not install over this one; uninstall first."
            fi
          } > notes.md
          gh release create "$TAG" "${files[@]}" "codefile-$TAG-sha256.txt" \
            --repo "$GITHUB_REPOSITORY" --title "CodeFile $TAG" --notes-file notes.md
